<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FAQ Generator | High-Quality Q&A Creator</title>
    <meta name="description" content="Generate high-quality FAQs instantly with AI. Supports product, service, and educational content.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <i class="ri-question-answer-line"></i>
                <h1>AI FAQ Generator</h1>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
                    <i class="ri-moon-line"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="app-container">
        <section class="input-section glass-panel">
            <div class="section-header">
                <h2>Content Source</h2>
                <p>Paste your content below and we'll generate comprehensive FAQs.</p>
            </div>

            <div class="controls-row">
                <div class="input-group">
                    <label for="category">Category</label>
                    <select id="category" class="custom-select">
                        <option value="General">General / Other</option>
                        <option value="Educational">Educational</option>
                        <option value="Product">Product Description</option>
                        <option value="Service">Service Details</option>
                        <option value="Technical">Technical / Documentation</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="content">Source Text</label>
                <textarea id="content" placeholder="Paste your article, product description, or any text here..." rows="8"></textarea>
                <div class="error-msg" id="input-error">Please enter some content before generating.</div>
            </div>

            <button id="generate-btn" class="primary-btn">
                <span>Generate FAQs</span>
                <i class="ri-magic-line"></i>
            </button>
        </section>

        <section class="output-section glass-panel" id="output-section" style="display: none;">
            <div class="section-header output-header">
                <div>
                    <h2>Generated FAQs</h2>
                    <p id="faq-count">0 Questions Generated</p>
                </div>
                <div class="action-buttons">
                    <button id="export-pdf" class="secondary-btn">
                        <i class="ri-file-pdf-line"></i>
                        Export PDF
                    </button>
                </div>
            </div>

            <div id="loading-state" class="loading-state">
                <div class="spinner"></div>
                <p>Analyzing content and generating high-quality questions...</p>
            </div>

            <div id="error-state" class="error-state" style="display: none;">
                <i class="ri-error-warning-line"></i>
                <p id="api-error-msg">An error occurred while generating FAQs.</p>
                <button id="retry-btn" class="secondary-btn">Try Again</button>
            </div>

            <div id="faq-container" class="faq-container">
                <!-- FAQs will be injected here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
